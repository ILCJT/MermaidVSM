<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mermaid Studio - Process & VSM Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .code-input { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; tab-size: 2; }
    .bg-grid-pattern { background-size: 24px 24px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
    /* Expand click targets for nodes and edges */
    #mermaidRender .node,
    #mermaidRender .edgePath,
    #mermaidRender .edgeLabel,
    #mermaidRender g.nodes g,
    #mermaidRender g.edgePaths path {
      cursor: pointer !important;
      pointer-events: all !important;
    }
    /* Invisible padded stroke (added by addEdgeHitPaths) so thin lines are easy to click */
    #mermaidRender path.edge-hit { stroke: transparent !important; stroke-width: 14px !important; fill: none !important; }
  </style>
</head>
<body class="h-full flex flex-col text-slate-100 overflow-hidden font-sans">
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex flex-wrap items-center justify-between gap-2 z-20 shrink-0">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 p-1.5 rounded-lg flex items-center justify-center text-white"><i data-lucide="code-2" class="w-5 h-5"></i></div>
      <div>
        <h1 class="text-sm font-bold leading-none text-slate-100">Mermaid Studio</h1>
        <p class="text-[10px] text-slate-400 font-medium">Process & VSM Workspace</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <select id="templateSelect" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-md px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500 max-w-[180px] sm:max-w-[240px] truncate">
        <option value="" selected disabled>Select a template...</option>
        <optgroup label="Lean & Value Stream">
          <option value="vsm_horizontal">Value Stream Map (LR + WIP)</option>
          <option value="standard_process">Standard Process Flow (Decision Gates)</option>
        </optgroup>
        <optgroup label="Cross-Functional & Handoffs">
          <option value="swimlanes">Departmental Swimlanes</option>
          <option value="sequence">Sequence Handoff Diagram</option>
        </optgroup>
        <optgroup label="Quality & Lifecycle">
          <option value="state_lifecycle">State Machine Lifecycle</option>
          <option value="root_cause">Root Cause Analysis Tree</option>
        </optgroup>
      </select>
    </div>
    <div class="flex items-center space-x-1.5">
      <label class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-slate-200 text-xs font-medium flex items-center space-x-1 cursor-pointer transition">
        <i data-lucide="folder-open" class="w-3.5 h-3.5 text-amber-400"></i>
        <span class="hidden sm:inline">Open</span>
        <input type="file" id="fileInput" accept=".vsm.json,.json,.mmd" class="hidden" onchange="handleFileSelect(event)">
      </label>
      <button onclick="saveProjectJSON()" title="Save Project (.vsm.json)" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-slate-200 text-xs font-medium flex items-center space-x-1 transition">
        <i data-lucide="save" class="w-3.5 h-3.5 text-emerald-400"></i>
        <span class="hidden sm:inline">Project</span>
      </button>
      <button onclick="exportSVG()" title="Export SVG" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-slate-200 text-xs font-medium flex items-center space-x-1 transition">
        <i data-lucide="file-code-2" class="w-3.5 h-3.5 text-blue-400"></i>
        <span class="hidden sm:inline">SVG</span>
      </button>
      <button onclick="exportPNG()" title="Export PNG" class="px-2 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-md text-white text-xs font-medium flex items-center space-x-1 shadow transition">
        <i data-lucide="image" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">PNG</span>
      </button>
    </div>
  </header>
  <main id="dropZone" class="flex-1 flex relative overflow-hidden">
    <section id="editorPanel" class="absolute bottom-12 left-3 w-80 sm:w-96 max-h-[320px] bg-slate-900/95 border border-slate-800 rounded-xl shadow-2xl z-30 flex flex-col backdrop-blur-md transition-all overflow-hidden">
      <div class="px-3 py-1.5 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400 shrink-0 h-9">
        <span class="font-mono text-[11px] text-slate-400 flex items-center gap-1.5"><i data-lucide="file-text" class="w-3.5 h-3.5 text-slate-500"></i> diagram.mmd</span>
        <div class="flex items-center space-x-2">
          <button id="editorToggleBtn" onclick="toggleEditorPanel()" title="Collapse / expand editor" class="hover:text-slate-200 transition flex items-center"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
          <button onclick="renderDiagram()" class="px-2 py-0.5 bg-blue-600 hover:bg-blue-500 text-white rounded font-semibold text-[11px] flex items-center gap-1 shadow transition"><i data-lucide="play" class="w-3 h-3 fill-current"></i> Render</button>
          <button onclick="formatCode()" class="hover:text-slate-200 transition flex items-center gap-1 ml-1"><i data-lucide="align-left" class="w-3 h-3"></i> Format</button>
          <button onclick="clearCode()" class="hover:text-rose-400 transition flex items-center gap-1"><i data-lucide="trash-2" class="w-3 h-3"></i> Clear</button>
        </div>
      </div>
      <div id="editorBody" class="h-[280px] relative overflow-hidden flex">
        <div id="lineNumbers" class="w-10 bg-slate-950/60 text-slate-600 text-right pr-2 pt-3 font-mono text-xs select-none border-r border-slate-800/50 shrink-0">1</div>
        <textarea id="mermaidCode" spellcheck="false" class="code-input flex-1 h-full w-full bg-transparent text-slate-200 p-3 text-xs leading-relaxed focus:outline-none resize-none overflow-auto" placeholder="Type or paste Mermaid syntax here..."></textarea>
      </div>
    </section>
    <section id="previewPanel" class="w-full h-full bg-slate-950 bg-grid-pattern relative flex flex-col flex-1 overflow-hidden">
      <div id="errorBanner" class="hidden absolute top-3 left-3 right-3 bg-rose-950/90 border border-rose-600/80 text-rose-200 p-3 rounded-lg shadow-xl z-30 max-h-40 overflow-auto backdrop-blur-sm transition-all">
        <div class="flex items-start justify-between">
          <div class="flex items-start space-x-2">
            <i data-lucide="alert-triangle" class="w-5 h-5 text-rose-400 shrink-0 mt-0.5"></i>
            <div>
              <h4 class="text-xs font-bold text-rose-300">Mermaid Syntax Error</h4>
              <p id="errorMessage" class="text-xs font-mono mt-1 text-rose-200/90 whitespace-pre-wrap leading-tight"></p>
            </div>
          </div>
          <button onclick="dismissError()" class="text-rose-400 hover:text-rose-200 p-0.5"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
      </div>
      <div class="absolute bottom-16 right-3 flex items-center bg-slate-900/90 border border-slate-800 rounded-lg p-1 space-x-1 z-20 backdrop-blur-sm shadow-md">
        <button onclick="zoomIn()" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition" title="Zoom In"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
        <button onclick="zoomOut()" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition" title="Zoom Out"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
        <button onclick="resetZoom()" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition" title="Reset View"><i data-lucide="maximize-2" class="w-4 h-4"></i></button>
      </div>
      <div id="canvasContainer" class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing">
        <div id="mermaidRender" class="w-full h-full flex items-center justify-center"></div>
      </div>
      <aside id="inspectorDrawer" class="hidden absolute top-3 right-3 w-80 sm:w-[22rem] max-h-[calc(100vh-180px)] bg-slate-900/95 border border-slate-800 rounded-xl shadow-2xl z-30 flex flex-col backdrop-blur-md transition-all overflow-y-auto">
        <div class="p-3 border-b border-slate-800 flex items-center justify-between">
          <div class="flex items-center space-x-1 bg-slate-800 p-0.5 rounded-md border border-slate-700">
            <button id="tabNodeInspector" onclick="switchInspectorTab('node')" class="flex items-center space-x-1.5 px-2.5 py-1 text-xs font-semibold rounded bg-blue-600 text-white shadow transition">
              <i data-lucide="sliders" class="w-3.5 h-3.5"></i><span>Node Inspector</span>
            </button>
            <button id="tabEdgeInspector" onclick="switchInspectorTab('edge')" class="flex items-center space-x-1.5 px-2.5 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-100 transition">
              <i data-lucide="spline" class="w-3.5 h-3.5"></i><span>Edge Inspector</span>
            </button>
          </div>
          <button onclick="closeInspector()" class="text-slate-400 hover:text-slate-200 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div id="edgeInspectorPanel" class="hidden p-4 space-y-4 overflow-y-auto flex-1 text-xs">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Edge Identifier</label>
            <input type="text" id="inspectorEdgeId" readonly class="w-full bg-slate-950 border border-slate-800 text-slate-400 rounded px-2.5 py-1.5 font-mono">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Line Label / Annotation</label>
            <input type="text" id="inspectorEdgeLabel" oninput="updateActiveEdgeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500" placeholder="e.g. Yes / Approved">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Line Style</label>
            <select id="inspectorEdgeStyle" onchange="updateActiveEdgeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500">
              <option value="solid">Solid (--&gt;)</option>
              <option value="dotted">Dotted (-.-&gt;)</option>
              <option value="thick">Thick (==&gt;)</option>
              <option value="invisible">Invisible Spacer (~~~)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Arrowhead Type</label>
            <select id="inspectorEdgeArrow" onchange="updateActiveEdgeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500">
              <option value="directed">Single Arrow (--&gt;)</option>
              <option value="bidirectional">Double Arrow (&lt;--&gt;)</option>
              <option value="circle">Circle / Dot (--o)</option>
              <option value="cross">Cross / Stop (--x)</option>
              <option value="open">Open Link (---)</option>
            </select>
          </div>
          <p id="inspectorEdgeNote" class="hidden text-[11px] text-amber-300"></p>
        </div>
        <div id="nodeInspectorPanel" class="p-4 space-y-4 overflow-y-auto flex-1 text-xs">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Node ID</label>
            <input type="text" id="inspectorNodeId" readonly class="w-full bg-slate-950 border border-slate-800 text-slate-400 rounded px-2.5 py-1.5 font-mono">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Step Name / Title</label>
            <input type="text" id="inspectorTitle" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Node Shape</label>
              <select id="inspectorNodeShape" onchange="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500 disabled:opacity-50">
                <option value="rect">Rectangle [ ]</option>
                <option value="rounded">Rounded Corners ( )</option>
                <option value="stadium">Stadium / Pill ([ ])</option>
                <option value="subroutine">Subroutine [[ ]]</option>
                <option value="cylinder">Database / Cylinder [( )]</option>
                <option value="diamond">Decision / Diamond { }</option>
                <option value="flag">Asymmetric Flag &gt; ]</option>
                <option value="hexagon">Hexagon {{ }}</option>
                <option value="circle">Circle (( ))</option>
                <option value="custom" disabled hidden>Custom (keep existing)</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Attach Icon</label>
              <select id="inspectorNodeIcon" onchange="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500 disabled:opacity-50">
                <option value="">No Icon</option>
                <option value="user">User / Actor (👤)</option>
                <option value="alert">Alert / Bottleneck (⚠️)</option>
                <option value="box">Package / Inventory (📦)</option>
                <option value="check">Checkmark / Pass (✅)</option>
                <option value="clock">Timer / Delay (⏱️)</option>
                <option value="truck">Transit / Delivery (🚚)</option>
                <option value="db">Database / Server (💾)</option>
                <option value="gear">Settings / Process (⚙️)</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Owner / Department</label>
            <input type="text" id="inspectorOwner" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500" placeholder="e.g. Quality Assurance">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Cycle Time (min)</label>
              <input type="number" id="inspectorCT" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500" min="0">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Changeover (min)</label>
              <input type="number" id="inspectorCO" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500" min="0">
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">WIP Quantity (pcs)</label>
            <input type="number" id="inspectorWIP" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500" min="0">
          </div>
          <div class="pt-2 border-t border-slate-800">
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" id="inspectorFriction" onchange="updateActiveNodeFromInspector()" class="rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-blue-500">
              <span class="text-xs font-semibold text-rose-300">Flag as Friction / Bottleneck Point</span>
            </label>
          </div>
        </div>
      </aside>
      <div id="vsmSummaryLadder" class="absolute bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 p-2.5 backdrop-blur-md z-20">
        <div class="flex items-center justify-between text-xs font-medium">
          <div class="flex items-center space-x-4">
            <span class="text-slate-300">VA Time: <strong id="summaryVATime" class="text-slate-100 font-mono">0m</strong></span>
            <span class="text-slate-300">Lead Time (PLT): <strong id="summaryPLT" class="text-slate-100 font-mono">0m</strong></span>
            <span class="text-slate-300">Total WIP: <strong id="summaryWIP" class="text-slate-100 font-mono">0 pcs</strong></span>
            <span class="text-slate-300">Friction Points: <strong id="summaryFriction" class="text-slate-100 font-mono">0</strong></span>
          </div>
          <div>
            <span class="text-slate-400 text-[11px]">Efficiency:</span>
            <span id="summaryEfficiency" class="px-2 py-0.5 rounded text-xs font-mono font-bold bg-blue-900/50 text-blue-300 border border-blue-700/50">0.0%</span>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="bg-slate-900 border-t border-slate-800 px-3 py-1 flex items-center justify-between text-[11px] text-slate-400 shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <span id="statusIndicator" class="flex items-center space-x-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span class="text-slate-300">Ready</span></span>
      <span class="text-slate-600">|</span>
      <span id="nodeCount">Nodes: 0</span>
    </div>
    <div><span class="text-slate-500">Engine: Mermaid v10</span></div>
  </footer>
  <script>
    const TEMPLATES = {
      vsm_horizontal: {
        title: "Value Stream Map - Standard Flow",
        mermaid: `graph LR\n    P1["1. Intake & Triage"] --> I1[/"WIP: 20 Pcs"\\] --> P2["2. Processing & Assembly"] --> I2[/"WIP: 50 Pcs"\\] --> P3["3. Final Quality Inspection"]\n\n    classDef friction fill:#451a03,stroke:#f97316,stroke-width:2px,color:#ffedd5;\n    class P2 friction;`,
        metrics: {
          P1: { title: "1. Intake & Triage", owner: "Receiving", ct: 10, co: 5, wip: 0, friction: false },
          I1: { title: "WIP: 20 Pcs", owner: "Buffer", ct: 0, co: 0, wip: 20, friction: false },
          P2: { title: "2. Processing & Assembly", owner: "Operations", ct: 45, co: 15, wip: 0, friction: true },
          I2: { title: "WIP: 50 Pcs", owner: "Buffer", ct: 0, co: 0, wip: 50, friction: false },
          P3: { title: "3. Final Quality Inspection", owner: "Quality Assurance", ct: 20, co: 5, wip: 0, friction: false }
        }
      },
      standard_process: {
        title: "Standard Process Flow",
        mermaid: `graph TD\n    A["1. Process Trigger"] --> B["2. Execution Step"]\n    B --> C{"3. Pass Inspection?"}\n    C -- Yes --> D["4. Complete & Log"]\n    C -- No --> E["5. Rework / Disposition"]\n    E --> B\n\n    classDef friction fill:#451a03,stroke:#f97316,stroke-width:2px,color:#ffedd5;\n    class E friction;`,
        metrics: {
          A: { title: "1. Process Trigger", owner: "Operations", ct: 5, co: 0, wip: 0, friction: false },
          B: { title: "2. Execution Step", owner: "Operations", ct: 25, co: 10, wip: 5, friction: false },
          C: { title: "3. Pass Inspection?", owner: "Quality Control", ct: 10, co: 0, wip: 0, friction: false },
          D: { title: "4. Complete & Log", owner: "Logistics", ct: 10, co: 0, wip: 0, friction: false },
          E: { title: "5. Rework / Disposition", owner: "Quality Control", ct: 30, co: 10, wip: 8, friction: true }
        }
      },
      swimlanes: {
        title: "Departmental Swimlane Flow",
        mermaid: `graph TD\n    subgraph Commercial ["Sales & Commercial"]\n        A["Order Creation"]\n    end\n    subgraph Engineering ["Engineering"]\n        B["Design Review"]\n    end\n    subgraph Quality ["Quality Assurance"]\n        C["Validation & Testing"]\n    end\n    subgraph Operations ["Operations & Shipping"]\n        D["Fulfillment & Release"]\n    end\n\n    A --> B --> C --> D`,
        metrics: {
          A: { title: "Order Creation", owner: "Sales", ct: 15, co: 0, wip: 3, friction: false },
          B: { title: "Design Review", owner: "Engineering", ct: 60, co: 30, wip: 10, friction: false },
          C: { title: "Validation & Testing", owner: "Quality Assurance", ct: 40, co: 15, wip: 5, friction: false },
          D: { title: "Fulfillment & Release", owner: "Operations", ct: 20, co: 10, wip: 2, friction: false }
        }
      },
      sequence: {
        title: "Sequence Handoff Diagram",
        mermaid: `sequenceDiagram\n    actor Client as Customer / Client\n    participant CS as Customer Service\n    participant QA as Quality Engineer\n    participant Ops as Operations Team\n\n    Client->>CS: Request Initiation\n    CS->>QA: Technical Assessment Request\n    QA->>Ops: Authorization & Release\n    Ops-->>Client: Confirmation & Delivery`,
        metrics: {}
      },
      state_lifecycle: {
        title: "State Machine Lifecycle",
        mermaid: `stateDiagram-v2\n    [*] --> Draft\n    Draft --> InReview : Submit for Review\n    InReview --> Approved : Quality Verification\n    InReview --> Rejected : Failure / Revision\n    Rejected --> Draft : Re-open Ticket\n    Approved --> Archived : Close Out\n    Archived --> [*]`,
        metrics: {}
      },
      root_cause: {
        title: "Root Cause / Tree Analysis",
        mermaid: `graph LR\n    Effect["Primary Failure Mode"] --> Machine["Machine / Hardware"]\n    Effect --> Method["Method / Procedure"]\n    Effect --> Material["Material / Supplier"]\n    \n    Machine --> M1["Out of Calibration"]\n    Method --> Me1["Outdated SOP"]\n    Material --> Ma1["Batch Variance"]`,
        metrics: {}
      }
    };
    let projectState = { title: "RMA Process Current State", mermaid: "", metrics: {} };
    let panZoomInstance = null, renderTimeout = null, activeNodeId = null, activeEdge = null;
    const mermaidCodeInput = document.getElementById('mermaidCode');
    const mermaidRender = document.getElementById('mermaidRender');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    const statusIndicator = document.getElementById('statusIndicator');
    const lineNumbers = document.getElementById('lineNumbers');
    const inspectorDrawer = document.getElementById('inspectorDrawer');

    window.addEventListener('DOMContentLoaded', () => {
      mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose', flowchart: { htmlLabels: true, curve: 'basis' } });
      mermaidCodeInput.value = projectState.mermaid;
      updateLineNumbers(); renderDiagram();
      ['input', 'paste', 'change', 'keyup'].forEach(evt => {
        mermaidCodeInput.addEventListener(evt, () => { projectState.mermaid = mermaidCodeInput.value; updateLineNumbers(); debouncedRender(); });
      });
      const dropZone = document.getElementById('dropZone');
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-950/20'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-blue-950/20'));
      dropZone.addEventListener('drop', handleFileDrop);
      mermaidRender.addEventListener('click', (e) => {
        const edgeEl = e.target.closest('.edgePath, .edgeLabel, g.edgePaths path, g.edgeLabels');
        if (edgeEl && openEdgeInspectorFromElement(edgeEl)) return;
        const targetEl = e.target.closest('.node, g.nodes > g, .actor, .actor-box, .role, .stateGroup');
        if (targetEl) {
          let nodeId = (targetEl.id || '').replace(/^(flowchart|actor|state)-/, '').replace(/-\d+$/, '');
          if (!nodeId) nodeId = targetEl.getAttribute('name') || targetEl.querySelector('text, tspan')?.textContent?.trim() || '';
          if (nodeId) openInspector(nodeId);
        }
      });
      document.getElementById('templateSelect').addEventListener('change', (e) => {
        const selected = TEMPLATES[e.target.value];
        if (selected) {
          projectState.title = selected.title;
          projectState.mermaid = selected.mermaid;
          projectState.metrics = JSON.parse(JSON.stringify(selected.metrics || {}));
          projectState.edges = {};
          mermaidCodeInput.value = selected.mermaid;
          closeInspector();
          updateLineNumbers(); renderDiagram(); calculateVSMMetrics();
        }
      });
      lucide.createIcons();
      calculateVSMMetrics();
    });

    function calculateVSMMetrics() {
      let totalVA = 0, totalCO = 0, totalWIP = 0, frictionCount = 0;
      Object.values(projectState.metrics || {}).forEach(m => {
        totalVA += Number(m.ct) || 0;
        totalCO += Number(m.co) || 0;
        totalWIP += Number(m.wip) || 0;
        if (m.friction) frictionCount++;
      });
      const totalPLT = totalVA + totalCO;
      const efficiency = totalPLT > 0 ? (totalVA / totalPLT) * 100 : 0;
      document.getElementById('summaryVATime').textContent = `${totalVA}m`;
      document.getElementById('summaryPLT').textContent = `${totalPLT}m`;
      document.getElementById('summaryWIP').textContent = `${totalWIP} pcs`;
      document.getElementById('summaryFriction').textContent = frictionCount;
      document.getElementById('summaryEfficiency').textContent = `${efficiency.toFixed(1)}%`;
    }

    function debouncedRender() { clearTimeout(renderTimeout); renderTimeout = setTimeout(renderDiagram, 200); }
    async function renderDiagram() {
      const code = mermaidCodeInput.value.trim();
      if (!code) {
        if (panZoomInstance) { panZoomInstance.destroy(); panZoomInstance = null; }
        mermaidRender.innerHTML = '<p class="text-xs text-slate-500 font-mono">Open a .vsm.json project file or select a template to begin.</p>';
        updateStatus('Ready', 'emerald'); dismissError(); return;
      }
      let pan = null, zoom = null;
      if (panZoomInstance) { pan = panZoomInstance.getPan(); zoom = panZoomInstance.getZoom(); }
      try {
        await mermaid.parse(code);
        mermaidRender.innerHTML = '';
        const id = 'mermaid-svg-' + Date.now();
        const { svg } = await mermaid.render(id, code);
        mermaidRender.innerHTML = svg;
        dismissError(); updateStatus('Rendered', 'emerald');
        const svgElement = mermaidRender.querySelector('svg');
        if (svgElement) {
          svgElement.removeAttribute('style');
          svgElement.style.width = '100%'; svgElement.style.height = '100%'; svgElement.style.overflow = 'visible';
          svgElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');
          if (panZoomInstance) panZoomInstance.destroy();
          addEdgeHitPaths(svgElement);
          panZoomInstance = svgPanZoom(svgElement, { zoomEnabled: true, controlIconsEnabled: false, dblClickZoomEnabled: false, fit: true, center: true, minZoom: 0.2, maxZoom: 8, contain: false, viewportSelector: null });
          if (pan && zoom) { panZoomInstance.resize(); panZoomInstance.zoom(zoom); panZoomInstance.pan(pan); }
          else refitCanvas();
        }
        const nodes = (code.match(/\[.*?\]|\(.*?\)|/g) || []).length;
        document.getElementById('nodeCount').textContent = `Nodes: ~${Math.floor(nodes / 2)}`;
      } catch (err) { showError(err.str || err.message || 'Syntax Error encountered.'); updateStatus('Syntax Error', 'rose'); }
    }

    function openInspector(nodeId) {
      activeNodeId = nodeId; document.getElementById('inspectorNodeId').value = nodeId;
      if (!projectState.metrics[nodeId]) { projectState.metrics[nodeId] = { title: nodeId, owner: '', ct: 0, co: 0, wip: 0, friction: false }; }
      const m = projectState.metrics[nodeId];
      const isFlowchart = /^\s*(graph|flowchart)\b/m.test(mermaidCodeInput.value);
      // The diagram code is the source of truth: shape, icon and title are read from one definition.
      const parsed = isFlowchart ? parseNodeDefinition(mermaidCodeInput.value, nodeId) : null;
      if (parsed) { m.shape = parsed.shape; m.icon = parsed.icon; m.title = parsed.title || nodeId; }
      else { m.shape = 'rect'; m.icon = ''; m.title = splitIconLabel(m.title || nodeId).text || nodeId; }
      document.getElementById('inspectorTitle').value = m.title;
      const shapeSel = document.getElementById('inspectorNodeShape'), iconSel = document.getElementById('inspectorNodeIcon');
      shapeSel.value = m.shape; iconSel.value = m.icon;
      shapeSel.disabled = iconSel.disabled = !isFlowchart;
      document.getElementById('inspectorOwner').value = m.owner || '';
      document.getElementById('inspectorCT').value = m.ct || 0;
      document.getElementById('inspectorCO').value = m.co || 0;
      document.getElementById('inspectorWIP').value = m.wip || 0;
      document.getElementById('inspectorFriction').checked = !!m.friction;
      switchInspectorTab('node');
      inspectorDrawer.classList.remove('hidden');
    }

    function closeInspector() { inspectorDrawer.classList.add('hidden'); activeNodeId = null; activeEdge = null; }

    function switchInspectorTab(tab) {
      const isEdge = tab === 'edge';
      document.getElementById('nodeInspectorPanel').classList.toggle('hidden', isEdge);
      document.getElementById('edgeInspectorPanel').classList.toggle('hidden', !isEdge);
      const active = ['bg-blue-600', 'text-white', 'shadow'], inactive = ['text-slate-400', 'hover:text-slate-100'];
      [['tabNodeInspector', !isEdge], ['tabEdgeInspector', isEdge]].forEach(([id, on]) => {
        const btn = document.getElementById(id);
        btn.classList.remove(...(on ? inactive : active));
        btn.classList.add(...(on ? active : inactive));
      });
    }
    function updateActiveNodeFromInspector() {
      if (!activeNodeId) return;
      projectState.metrics[activeNodeId] = {
        title: document.getElementById('inspectorTitle').value,
        owner: document.getElementById('inspectorOwner').value,
        ct: parseFloat(document.getElementById('inspectorCT').value) || 0,
        co: parseFloat(document.getElementById('inspectorCO').value) || 0,
        wip: parseFloat(document.getElementById('inspectorWIP').value) || 0,
        friction: document.getElementById('inspectorFriction').checked,
        shape: document.getElementById('inspectorNodeShape').value,
        icon: document.getElementById('inspectorNodeIcon').value
      };
      syncNodeToMermaid(activeNodeId, projectState.metrics[activeNodeId]);
      calculateVSMMetrics();
    }

    function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    const SHAPE_MAP = {
      rect:       { open: '[',  close: ']'  },
      rounded:    { open: '(',  close: ')'  },
      stadium:    { open: '([', close: '])' },
      subroutine: { open: '[[', close: ']]' },
      cylinder:   { open: '[(', close: ')]' },
      diamond:    { open: '{',  close: '}'  },
      flag:       { open: '>',  close: ']'  },
      hexagon:    { open: '{{', close: '}}' },
      circle:     { open: '((', close: '))' }
    };
    // Shapes outside the picker are reported as "custom" and keep their existing brackets.
    const CUSTOM_SHAPES = [['(((', ')))'], ['[/', '/]'], ['[\\', '\\]'], ['[/', '\\]'], ['[\\', '/]']];
    // Longest openers first so "([" is not mistaken for "(".
    const SHAPE_DETECT = [
      ...Object.entries(SHAPE_MAP).map(([shape, t]) => [shape, t.open, t.close]),
      ...CUSTOM_SHAPES.map(([open, close]) => ['custom', open, close])
    ].sort((a, b) => b[1].length - a[1].length);
    const ICONS = { user: '👤', alert: '⚠️', box: '📦', check: '✅', clock: '⏱️', truck: '🚚', db: '💾', gear: '⚙️' };
    const stripVS = s => s.replace(/\uFE0F/g, '');

    function addEdgeHitPaths(svg) {
      svg.querySelectorAll('g.edgePaths > path').forEach(p => {
        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hit.setAttribute('d', p.getAttribute('d'));
        hit.setAttribute('class', 'edge-hit');
        hit.dataset.edgeFor = p.id;
        p.parentNode.insertBefore(hit, p.nextSibling);
      });
    }

    function splitIconLabel(label) {
      const raw = label || '';
      // Icon above title: <span ...>EMOJI</span><br/>Title. Legacy form: "EMOJI Title".
      const html = raw.match(/^\s*<span[^>]*>([\s\S]*?)<\/span>\s*<br\s*\/?>\s*([\s\S]*)$/i);
      const iconPart = html ? html[1] : raw, titlePart = html ? html[2] : null;
      const plain = stripVS(iconPart).trim();
      for (const [key, emoji] of Object.entries(ICONS)) {
        const e = stripVS(emoji);
        if (plain.startsWith(e)) return { icon: key, text: (html ? titlePart : plain.slice(e.length)).trim() };
      }
      return { icon: '', text: raw.trim() };
    }

    // Finds every definition of nodeId that carries a shape enclosure, e.g. A(["label"]).
    // Quoted text is masked first so an id mentioned inside another node's label is never matched.
    function findNodeDefs(code, nodeId) {
      const defs = [];
      const idRe = new RegExp('(^|[^\\w])' + escapeRegExp(nodeId) + '(?=[\\[({>])', 'g');
      let offset = 0;
      code.split('\n').forEach(line => {
        const lineStart = offset; offset += line.length + 1;
        if (EDGE_SKIP.test(line)) return;
        const masked = line.replace(/"[^"]*"/g, s => '\u0001'.repeat(s.length));
        idRe.lastIndex = 0;
        let hit;
        while ((hit = idRe.exec(masked))) {
          const openAt = hit.index + hit[0].length;
          const idAt = openAt - nodeId.length;
          for (const [shape, open, close] of SHAPE_DETECT) {
            if (!line.startsWith(open, openAt)) continue;
            const bodyAt = openAt + open.length;
            let label, endAt;
            if (line[bodyAt] === '"') {
              const q = line.indexOf('"', bodyAt + 1);
              if (q < 0 || !line.startsWith(close, q + 1)) continue;
              label = line.slice(bodyAt + 1, q); endAt = q + 1 + close.length;
            } else {
              const c = line.indexOf(close, bodyAt);
              if (c < 0) continue;
              label = line.slice(bodyAt, c); endAt = c + close.length;
            }
            defs.push({ start: lineStart + idAt, end: lineStart + endAt, shape, open, close, label: label.replace(/#quot;/g, '"') });
            idRe.lastIndex = endAt;
            break;
          }
        }
      });
      return defs;
    }

    // One pass over the first definition: { shape, icon, title } or null when the node has no brackets yet.
    function parseNodeDefinition(code, nodeId) {
      const def = findNodeDefs(code, nodeId)[0];
      if (!def) return null;
      const { icon, text } = splitIconLabel(def.label);
      return { shape: def.shape, icon, title: text, def };
    }
    function getNodeLabel(nodeId) {
      const def = findNodeDefs(mermaidCodeInput.value, nodeId)[0];
      return def ? def.label : null;
    }

    // Position right after the first bare (shape-less) mention of nodeId, used to attach a definition.
    function findBareNodeEnd(code, nodeId) {
      const re = new RegExp('(^|[^\\w])' + escapeRegExp(nodeId) + '(?![\\w])');
      let offset = 0, found = -1;
      code.split('\n').some(line => {
        const lineStart = offset; offset += line.length + 1;
        if (EDGE_SKIP.test(line)) return false;
        const hit = re.exec(maskMermaidLine(line));
        if (!hit) return false;
        found = lineStart + hit.index + hit[0].length;
        return true;
      });
      return found;
    }

    function syncNodeToMermaid(nodeId, m) {
      let code = mermaidCodeInput.value;
      const isFlowchart = /^\s*(graph|flowchart)\b/m.test(code);
      if (isFlowchart) {
        const defs = findNodeDefs(code, nodeId);
        const shape = m.shape || (defs[0] ? defs[0].shape : 'rect');
        const cleanTitleText = (m.title || '').trim() || (defs[0] ? splitIconLabel(defs[0].label).text : '') || nodeId;
        const safeTitle = cleanTitleText.replace(/"/g, '#quot;');
        const fullLabel = m.icon && ICONS[m.icon] ? `<span class='block text-sm mb-0.5'>${ICONS[m.icon]}</span><br/>${safeTitle}` : safeTitle;
        // Atomic definition: ID + brackets + label are replaced together in one pass.
        const define = (tokens) => `${nodeId}${tokens.open}"${fullLabel}"${tokens.close}`;
        if (defs.length) {
          for (let i = defs.length - 1; i >= 0; i--) {
            const d = defs[i];
            const tokens = SHAPE_MAP[shape] || { open: d.open, close: d.close };
            code = code.slice(0, d.start) + define(tokens) + code.slice(d.end);
          }
        } else if (SHAPE_MAP[shape] && (shape !== 'rect' || m.icon || cleanTitleText !== nodeId)) {
          const at = findBareNodeEnd(code, nodeId);
          if (at >= 0) code = code.slice(0, at - nodeId.length) + define(SHAPE_MAP[shape]) + code.slice(at);
        }
      }
      if (isFlowchart) {
        const classLine = new RegExp('^[ \\t]*class[ \\t]+' + escapeRegExp(nodeId) + '[ \\t]+friction;?[ \\t]*$\\n?', 'gm');
        const hasClass = new RegExp('^[ \\t]*class[ \\t]+' + escapeRegExp(nodeId) + '[ \\t]+friction;?[ \\t]*$', 'm').test(code);
        if (m.friction && !hasClass) {
          if (!/^[ \t]*classDef[ \t]+friction\b/m.test(code)) {
            code = code.replace(/\s*$/, '\n') + '    classDef friction fill:#7f1d1d,stroke:#f43f5e,stroke-width:2px,color:#fecdd3;\n';
          }
          code = code.replace(/\s*$/, '\n') + `    class ${nodeId} friction;\n`;
        } else if (!m.friction && hasClass) {
          code = code.replace(classLine, '');
          if (!/^[ \t]*class[ \t]+[^\n]*\bfriction;?[ \t]*$/m.test(code)) {
            code = code.replace(/^[ \t]*classDef[ \t]+friction\b.*$\n?/gm, '');
          }
        }
      }
      if (code !== mermaidCodeInput.value) {
        mermaidCodeInput.value = projectState.mermaid = code;
        updateLineNumbers();
        debouncedRender();
      }
    }

    const EDGE_SKIP = /^\s*(?:(?:classDef|class|style|linkStyle|subgraph|click|direction|end)\b|%%)/;
    const EDGE_CONN = /(<)?(?:(?:--|==|-\.)[ \t]+[^\n]*?[ \t]+(?:-{2,}|={2,}|\.-)[>ox]?|(?:-{2,}|={2,}|-\.+-?|~{3,})[>ox]?(?:[ \t]*\|[^|\n]*\|)?)/g;

    function maskMermaidLine(line) {
      let out = line.replace(/"[^"]*"/g, s => '\u0001'.repeat(s.length));
      let prev;
      do { prev = out; out = out.replace(/[\[({][^\[\](){}]*[\])}]/g, s => '\u0001'.repeat(s.length)); } while (out !== prev);
      return out;
    }
    function cleanEdgeLabel(s) { return (s || '').trim().replace(/^"([\s\S]*)"$/, '$1').replace(/#quot;/g, '"').trim(); }
    function headToArrow(h) { return h === '>' ? 'directed' : h === 'o' ? 'circle' : h === 'x' ? 'cross' : 'open'; }

    function parseMermaidConnector(text) {
      let m = text.match(/^(<)?(--|==|-\.)[ \t]+([\s\S]*?)[ \t]+(?:-{2,}|={2,}|\.-)([>ox])?$/);
      if (m) {
        return { label: cleanEdgeLabel(m[3]), style: m[2] === '==' ? 'thick' : m[2] === '-.' ? 'dotted' : 'solid', arrow: m[1] ? 'bidirectional' : headToArrow(m[4]) };
      }
      m = text.match(/^(<)?(-{2,}|={2,}|-\.+-?|~{3,})([>ox])?(?:[ \t]*\|([^|]*)\|)?$/);
      if (!m) return null;
      const body = m[2];
      return { label: cleanEdgeLabel(m[4]), style: body[0] === '~' ? 'invisible' : body[0] === '=' ? 'thick' : body.includes('.') ? 'dotted' : 'solid', arrow: m[1] ? 'bidirectional' : headToArrow(m[3]) };
    }

    function buildMermaidConnector(style, arrow, label) {
      if (style === 'invisible') return '~~~';
      const S = {
        solid: { lead: '--', tail: '', open: '-', end: '--' },
        thick: { lead: '==', tail: '', open: '=', end: '==' },
        dotted: { lead: '-.', tail: '-', open: '', end: '.-' }
      }[style] || { lead: '--', tail: '', open: '-', end: '--' };
      const head = { directed: '>', bidirectional: '>', circle: 'o', cross: 'x' }[arrow] || '';
      const pre = arrow === 'bidirectional' ? '<' : '';
      const safe = (label || '').trim().replace(/"/g, '#quot;');
      if (!safe) return pre + S.lead + S.tail + (head || S.open);
      return `${pre}${S.lead} "${safe}" ${S.end}${head || S.open}`;
    }

    function parseMermaidEdges(code) {
      const edges = [];
      if (!/^\s*(graph|flowchart)\b/m.test(code)) return edges;
      const counts = {};
      let offset = 0;
      code.split('\n').forEach(line => {
        const lineStart = offset; offset += line.length + 1;
        if (EDGE_SKIP.test(line)) return;
        const masked = maskMermaidLine(line);
        const conns = [...masked.matchAll(EDGE_CONN)];
        conns.forEach((m, i) => {
          const prevEnd = i ? conns[i - 1].index + conns[i - 1][0].length : 0;
          const nextStart = i + 1 < conns.length ? conns[i + 1].index : masked.length;
          const src = (masked.slice(prevEnd, m.index).split('&').pop().match(/^\s*(\w+)/) || [])[1];
          const tgt = (masked.slice(m.index + m[0].length, nextStart).split('&')[0].match(/^\s*(\w+)/) || [])[1];
          const parsed = parseMermaidConnector(line.slice(m.index, m.index + m[0].length));
          if (!src || !tgt || !parsed) return;
          const pair = src + '\0' + tgt;
          const idx = counts[pair] = (counts[pair] ?? -1) + 1;
          edges.push({ src, tgt, idx, start: lineStart + m.index, end: lineStart + m.index + m[0].length, ...parsed });
        });
      });
      return edges;
    }

    function edgeKey(e) { return `${e.src}_to_${e.tgt}${e.idx ? '_' + (e.idx + 1) : ''}`; }

    function openEdgeInspectorFromElement(el) {
      const edges = parseMermaidEdges(mermaidCodeInput.value);
      if (!edges.length) return false;
      const hitPath = el.matches('path') ? el : el.querySelector('path');
      const pathEl = hitPath?.dataset?.edgeFor ? mermaidRender.querySelector(`[id="${hitPath.dataset.edgeFor}"]`) : hitPath;
      const rawId = pathEl?.id || el.querySelector('[data-id]')?.getAttribute('data-id') || el.getAttribute('data-id') || '';
      const idxMatch = rawId.match(/[-_](\d+)$/);
      const cls = pathEl?.getAttribute('class') || '';
      const ls = cls.match(/\bLS-(\S+)/), le = cls.match(/\bLE-(\S+)/);
      let edge = rawId && edges.find(e => [`L-${e.src}-${e.tgt}-${e.idx}`, `L_${e.src}_${e.tgt}_${e.idx}`].includes(rawId));
      if (!edge && ls && le) edge = edges.find(e => e.src === ls[1] && e.tgt === le[1] && e.idx === (idxMatch ? Number(idxMatch[1]) : 0));
      if (!edge && el.classList.contains('edgeLabel')) {
        edge = edges[[...el.parentElement.children].filter(c => c.classList.contains('edgeLabel')).indexOf(el)];
      }
      if (!edge) {
        const text = el.textContent.trim();
        if (text) edge = edges.find(e => e.label === text);
      }
      if (!edge) return false;
      activeEdge = { src: edge.src, tgt: edge.tgt, idx: edge.idx };
      document.getElementById('inspectorEdgeId').value = edgeKey(edge);
      document.getElementById('inspectorEdgeLabel').value = edge.label;
      document.getElementById('inspectorEdgeStyle').value = edge.style;
      document.getElementById('inspectorEdgeArrow').value = edge.arrow;
      refreshEdgeInspectorState();
      switchInspectorTab('edge');
      inspectorDrawer.classList.remove('hidden');
      return true;
    }

    function refreshEdgeInspectorState(note) {
      const invisible = document.getElementById('inspectorEdgeStyle').value === 'invisible';
      document.getElementById('inspectorEdgeLabel').disabled = invisible;
      document.getElementById('inspectorEdgeArrow').disabled = invisible;
      const noteEl = document.getElementById('inspectorEdgeNote');
      const msg = note || (invisible ? 'Invisible spacers (~~~) do not support labels or arrowheads.' : '');
      noteEl.textContent = msg; noteEl.classList.toggle('hidden', !msg);
    }

    function updateActiveEdgeFromInspector() {
      if (!activeEdge) return;
      refreshEdgeInspectorState();
      const code = mermaidCodeInput.value;
      const edge = parseMermaidEdges(code).find(e => e.src === activeEdge.src && e.tgt === activeEdge.tgt && e.idx === activeEdge.idx);
      if (!edge) { refreshEdgeInspectorState('This connection was not found in the Mermaid code.'); return; }
      const label = document.getElementById('inspectorEdgeLabel').value;
      const style = document.getElementById('inspectorEdgeStyle').value;
      const arrow = document.getElementById('inspectorEdgeArrow').value;
      const next = code.slice(0, edge.start) + buildMermaidConnector(style, arrow, label) + code.slice(edge.end);
      projectState.edges = projectState.edges || {};
      projectState.edges[edgeKey(edge)] = { source: edge.src, target: edge.tgt, label: label.trim(), style, arrow };
      if (next !== code) {
        mermaidCodeInput.value = projectState.mermaid = next;
        updateLineNumbers();
        debouncedRender();
      }
    }

    function handleFileDrop(e) { e.preventDefault(); document.getElementById('dropZone').classList.remove('bg-blue-950/20'); if (e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]); }
    function handleFileSelect(e) { if (e.target.files.length > 0) loadFile(e.target.files[0]); }
    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const content = evt.target.result;
        if (file.name.endsWith('.json')) {
          try {
            const parsed = JSON.parse(content);
            if (parsed.mermaid) {
              projectState = parsed;
              if (parsed.project?.title) projectState.title = parsed.project.title;
              mermaidCodeInput.value = parsed.mermaid;
            }
          } catch(err) { alert('Invalid project JSON file.'); }
        } else { projectState.mermaid = content; mermaidCodeInput.value = content; }
        updateLineNumbers(); renderDiagram(); calculateVSMMetrics();
      };
      reader.readAsText(file);
    }

    function saveProjectJSON() {
      projectState.mermaid = mermaidCodeInput.value;
      const jsonStr = JSON.stringify(projectState, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      const title = projectState.project?.title || projectState.title || "vsm_project";
      a.download = `${title.toLowerCase().replace(/\s+/g, '_')}.vsm.json`; a.click();
    }

    function updateLineNumbers() { lineNumbers.innerHTML = Array.from({ length: mermaidCodeInput.value.split('\n').length }, (_, i) => i + 1).join('<br>'); }
    function showError(msg) { errorMessage.textContent = msg; errorBanner.classList.remove('hidden'); }
    function dismissError() { errorBanner.classList.add('hidden'); }
    function updateStatus(text, color) {
      const colorMap = { emerald: 'bg-emerald-500', rose: 'bg-rose-500', amber: 'bg-amber-500' };
      statusIndicator.innerHTML = `<span class="w-2 h-2 rounded-full ${colorMap[color] || 'bg-slate-500'}"></span><span class="text-slate-300">${text}</span>`;
    }

    function refitCanvas() {
      if (!panZoomInstance) return;
      panZoomInstance.resize(); panZoomInstance.fit(); panZoomInstance.center();
    }
    function toggleEditorPanel() {
      const body = document.getElementById('editorBody');
      const collapsed = body.classList.toggle('hidden');
      const btn = document.getElementById('editorToggleBtn');
      btn.innerHTML = `<i data-lucide="${collapsed ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4"></i>`;
      lucide.createIcons();
      if (panZoomInstance) panZoomInstance.resize();
    }
    let resizeTimer;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(refitCanvas, 100); });

    function zoomIn() { if (panZoomInstance) panZoomInstance.zoomIn(); }
    function zoomOut() { if (panZoomInstance) panZoomInstance.zoomOut(); }
    function resetZoom() { if (panZoomInstance) { panZoomInstance.resetZoom(); panZoomInstance.fit(); panZoomInstance.center(); } }
    function clearCode() { mermaidCodeInput.value = ''; updateLineNumbers(); renderDiagram(); calculateVSMMetrics(); }
    function formatCode() { mermaidCodeInput.value = mermaidCodeInput.value.split('\n').map(l => l.trimEnd()).join('\n'); updateLineNumbers(); }
    function exportSVG() {
      const svg = mermaidRender.querySelector('svg');
      if (!svg) return alert('No diagram to export.');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
      a.download = `vsm-process-${Date.now()}.svg`; a.click();
    }
    function exportPNG() {
      const svg = mermaidRender.querySelector('svg');
      if (!svg) return alert('No diagram to export.');
      const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); const img = new Image();
      img.onload = () => {
        canvas.width = img.width * 2; canvas.height = img.height * 2;
        ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = `vsm-process-${Date.now()}.png`; a.click();
      };
      img.src = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
    }
  </script>
</body>
</html>
