    }

    function closeInspector() { inspectorDrawer.classList.add('hidden'); activeNodeId = null; activeEdge = null; }

    function switchInspectorTab(tab) {
      const isEdge = tab === 'edge';
      document.getElementById('nodeInspectorPanel').classList.toggle('hidden', isEdge);
      document.getElementById('edgeInspectorPanel').classList.toggle('hidden', !isEdge);
      const active = ['bg-blue-600', 'text-white', 'shadow'], inactive = ['text-slate-400', 'hover:text-slate-100'];
      [['tabNodeInspector', !isEdge], ['tabEdgeInspector', isEdge]].forEach(([id, on]) => {
        const btn = document.getElementById(id);
        btn.classList.remove(...(on ? inactive : active));
        btn.classList.add(...(on ? active : inactive));
      });
    }
    function updateActiveNodeFromInspector() {
      if (!activeNodeId) return;
      projectState.metrics[activeNodeId] = {
        title: document.getElementById('inspectorTitle').value,
        owner: document.getElementById('inspectorOwner').value,
        ct: parseFloat(document.getElementById('inspectorCT').value) || 0,
        co: parseFloat(document.getElementById('inspectorCO').value) || 0,
        wip: parseFloat(document.getElementById('inspectorWIP').value) || 0,
        friction: document.getElementById('inspectorFriction').checked,
        shape: document.getElementById('inspectorNodeShape').value,
        icon: document.getElementById('inspectorNodeIcon').value
      };
      syncNodeToMermaid(activeNodeId, projectState.metrics[activeNodeId]);
      calculateVSMMetrics();
    }

    function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function subgraphRegex(id) {
      return new RegExp('^([ \\t]*subgraph[ \\t]+)' + escapeRegExp(id) + '(?:[ \\t]*\\[(?:"([^"]*)"|([^\\]\\n]*))\\])?[ \\t]*$', 'm');
    }
    function findSubgraph(code, id) {
      const m = code.match(subgraphRegex(id));
      return m ? { label: (m[2] ?? m[3] ?? id).trim() || id } : null;
    }
    const SHAPE_MAP = {
      rect:       { open: '[',  close: ']'  },
      rounded:    { open: '(',  close: ')'  },
      stadium:    { open: '([', close: '])' },
      subroutine: { open: '[[', close: ']]' },
      cylinder:   { open: '[(', close: ')]' },
      diamond:    { open: '{',  close: '}'  },
      flag:       { open: '>',  close: ']'  },
      hexagon:    { open: '{{', close: '}}' },
      circle:     { open: '((', close: '))' }
    };
    // Shapes outside the picker are reported as "custom" and keep their existing brackets.
    const CUSTOM_SHAPES = [['(((', ')))'], ['[/', '/]'], ['[\\', '\\]'], ['[/', '\\]'], ['[\\', '/]']];
    // Longest openers first so "([" is not mistaken for "(".
    const SHAPE_DETECT = [
      ...Object.entries(SHAPE_MAP).map(([shape, t]) => [shape, t.open, t.close]),
      ...CUSTOM_SHAPES.map(([open, close]) => ['custom', open, close])
    ].sort((a, b) => b[1].length - a[1].length);
    const ICONS = { process_dedicated: '🏭', process_shared: '🔀', workcell: '🧩', supplier: '🏭', customer: '👑', kaizen: '💥', milk_run: '🚚', supermarket: '🏬', inspection: '🔍' };
    const stripVS = s => s.replace(/\uFE0F/g, '');

    function addEdgeHitPaths(svg) {
      svg.querySelectorAll('g.edgePaths > path').forEach(p => {
        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hit.setAttribute('d', p.getAttribute('d'));
        hit.setAttribute('class', 'edge-hit');
        hit.dataset.edgeFor = p.id;
        p.parentNode.insertBefore(hit, p.nextSibling);
      });
      // Sequence messages are bare <line>/<path> elements, so give each a wide invisible twin.
      svg.querySelectorAll('.messageLine0, .messageLine1').forEach((el, i) => {
        const hit = el.cloneNode(false);
        ['id', 'marker-end', 'marker-start', 'style'].forEach(a => hit.removeAttribute(a));
        hit.setAttribute('class', 'edge-hit');
        hit.dataset.msgIndex = i;
        el.parentNode.insertBefore(hit, el.nextSibling);
      });
    }

    function diagramKind(code) {
      const first = (code.match(/^[ \t]*(?!%%)(\S+)/m) || [])[1] || '';
      if (/^(graph|flowchart)$/.test(first)) return 'flow';
      if (first === 'sequenceDiagram') return 'sequence';
      if (/^stateDiagram/.test(first)) return 'state';
      return 'other';
    }

    function parseSequenceParticipants(code) {
      const map = {};
      code.split('\n').forEach(l => {
        const m = l.match(/^\s*(?:participant|actor)\s+(\w+)(?:\s+as\s+(.+?))?\s*$/);
        if (m) map[m[1]] = { label: (m[2] || m[1]).trim() };
      });
      return map;
    }

    const SEQ_OPS = {
      '->>': ['solid', 'directed'], '-->>': ['dotted', 'directed'], '->': ['solid', 'open'], '-->': ['dotted', 'open'],
      '-x': ['solid', 'cross'], '--x': ['dotted', 'cross'], '-)': ['solid', 'circle'], '--)': ['dotted', 'circle']
    };
    function buildSequenceOperator(style, arrow) {
      return (style === 'dotted' ? '--' : '-') + ({ open: '', cross: 'x', circle: ')' }[arrow] ?? '>>');
    }

    function parseSequenceMessages(code) {
      const msgs = [], counts = {};
      let offset = 0;
      code.split('\n').forEach(raw => {
        const lineStart = offset; offset += raw.length + 1;
        const line = raw.replace(/\r$/, '');
        const m = line.match(/^([ \t]*\w+[ \t]*)(-->>|->>|--x|-x|--\)|-\)|-->|->)([+-]?)[ \t]*(\w+)[ \t]*:(.*)$/);
        if (!m) return;
        const [style, arrow] = SEQ_OPS[m[2]];
        const pair = m[1].trim() + '\0' + m[4];
        const idx = counts[pair] = (counts[pair] ?? -1) + 1;
        msgs.push({ kind: 'sequence', ord: msgs.length, src: m[1].trim(), tgt: m[4], act: m[3], idx, label: m[5].trim() === '#nbsp;' ? '' : m[5].trim(), style, arrow, start: lineStart + m[1].length, end: lineStart + line.length });
      });
      return msgs;
    }

    function parseStateTransitions(code) {
      const trans = [], counts = {};
      let offset = 0;
      code.split('\n').forEach(raw => {
        const lineStart = offset; offset += raw.length + 1;
        const line = raw.replace(/\r$/, '');
        const m = line.match(/^([ \t]*(\[\*\]|\w+)[ \t]*-->[ \t]*(\[\*\]|\w+))[ \t]*(?::[ \t]*(.*))?$/);
        if (!m) return;
        const src = m[2] === '[*]' ? 'start' : m[2], tgt = m[3] === '[*]' ? 'end' : m[3];
        const idx = counts[src + '\0' + tgt] = (counts[src + '\0' + tgt] ?? -1) + 1;
        trans.push({ kind: 'state', ord: trans.length, src, tgt, idx, label: (m[4] || '').trim(), style: 'solid', arrow: 'directed', start: lineStart + m[1].length, end: lineStart + line.length });
      });
      return trans;
    }

    function resolveSequenceActorId(el) {
      const named = el.closest('[name]');
      if (named?.getAttribute('name')) return named.getAttribute('name');
      const labels = [...mermaidRender.querySelectorAll('text.actor')];
      if (!labels.length) return '';
      let text;
      if (el.matches('text.actor')) text = el;
      else {
        const r = el.getBoundingClientRect(), cx = r.x + r.width / 2, cy = r.y + r.height / 2;
        const xOnly = el.tagName === 'line';
        let best = Infinity;
        labels.forEach(t => {
          const b = t.getBoundingClientRect();
          const d = (b.x + b.width / 2 - cx) ** 2 + (xOnly ? 0 : (b.y + b.height / 2 - cy) ** 2);
          if (d < best) { best = d; text = t; }
        });
      }
      const label = text.textContent.replace(/\s+/g, ' ').trim();
      const parts = parseSequenceParticipants(mermaidCodeInput.value);
      return Object.keys(parts).find(id => parts[id].label === label) || label;
    }

    function openSequenceMessageInspector(el) {
      const msgs = parseSequenceMessages(mermaidCodeInput.value);
      const all = sel => [...mermaidRender.querySelectorAll(sel)];
      let ord = -1;
      const hit = el.closest('.edge-hit[data-msg-index]');
      const text = el.closest('text.messageText');
      const line = el.closest('.messageLine0, .messageLine1');
      if (hit) ord = Number(hit.dataset.msgIndex);
      else if (text) ord = all('text.messageText').indexOf(text);
      else if (line) ord = all('.messageLine0, .messageLine1').indexOf(line);
      else {
        const inner = el.querySelector('.messageLine0, .messageLine1');
        if (inner) ord = all('.messageLine0, .messageLine1').indexOf(inner);
      }
      return !!msgs[ord] && showEdgeInspector(msgs[ord]);
    }

    function openStateTransitionFromElement(el) {
      const trans = parseStateTransitions(mermaidCodeInput.value);
      const labelG = el.closest('g.edgeLabel');
      let ord = -1;
      if (labelG) ord = [...mermaidRender.querySelectorAll('g.edgeLabels > g.edgeLabel')].indexOf(labelG);
      else {
        let p = el.closest('path');
        if (p?.dataset.edgeFor) p = mermaidRender.querySelector(`[id="${p.dataset.edgeFor}"]`);
        if (p) ord = [...mermaidRender.querySelectorAll('g.edgePaths > path:not(.edge-hit)')].indexOf(p);
      }
      return !!trans[ord] && showEdgeInspector(trans[ord]);
    }

    function showEdgeInspector(edge) {
      activeNodeId = null;
      activeEdge = { kind: edge.kind || 'flow', src: edge.src, tgt: edge.tgt, idx: edge.idx, ord: edge.ord };
      document.getElementById('inspectorEdgeId').value = edgeKey(edge);
      document.getElementById('inspectorEdgeLabel').value = edge.label;
      const styleSel = document.getElementById('inspectorEdgeStyle'), arrowSel = document.getElementById('inspectorEdgeArrow');
      const allowed = {
        flow: null,
        sequence: { style: ['solid', 'dotted'], arrow: ['directed', 'open', 'cross', 'circle'] },
        state: { style: ['solid'], arrow: ['directed'] }
      }[activeEdge.kind];
      [[styleSel, 'style'], [arrowSel, 'arrow']].forEach(([sel, key]) => {
        [...sel.options].forEach(o => { o.disabled = !!allowed && !allowed[key].includes(o.value); });
      });
      styleSel.value = edge.style; arrowSel.value = edge.arrow;
      refreshEdgeInspectorState();
      switchInspectorTab('edge');
      inspectorDrawer.classList.remove('hidden');
      return true;
    }

    function splitIconLabel(label) {
      const raw = (label || '').replace(/<br\s*\/?>\s*<span[^>]*text-\[10px\][^>]*>[\s\S]*?<\/span>\s*$/i, '');
      // Icon above title: <span ...>EMOJI</span><br/>Title. Legacy form: "EMOJI Title".
      // Current form: <span class='relative…'><span class='absolute…'>EMOJI</span>Title</span>.
      const badge = raw.match(/^\s*<span[^>]*\brelative\b[^>]*>\s*<span([^>]*)>([\s\S]*?)<\/span>([\s\S]*?)<\/span>\s*$/i);
      if (badge) {
        // data-icon disambiguates icons that share an emoji (e.g. Dedicated Process vs External Supplier).
        const key = (badge[1].match(/data-icon=['"]([\w]+)['"]/) || [])[1];
        const plainBadge = stripVS(badge[2]).trim();
        const found = ICONS[key] && stripVS(ICONS[key]) === plainBadge ? key : Object.keys(ICONS).find(k => stripVS(ICONS[k]) === plainBadge) || '';
        return { icon: found, text: badge[3].trim() };
      }
      const html = raw.match(/^\s*<span[^>]*>([\s\S]*?)<\/span>\s*<br\s*\/?>\s*([\s\S]*)$/i);
      const iconPart = html ? html[1] : raw, titlePart = html ? html[2] : null;
      const plain = stripVS(iconPart).trim();
      for (const [key, emoji] of Object.entries(ICONS)) {
        const e = stripVS(emoji);
        if (plain.startsWith(e)) return { icon: key, text: (html ? titlePart : plain.slice(e.length)).trim() };
      }
      return { icon: '', text: raw.trim() };
    }

    // Finds every definition of nodeId that carries a shape enclosure, e.g. A(["label"]).
    // Quoted text is masked first so an id mentioned inside another node's label is never matched.
    function findNodeDefs(code, nodeId) {
      const defs = [];
      const idRe = new RegExp('(^|[^\\w])' + escapeRegExp(nodeId) + '(?=[\\[({>])', 'g');
      let offset = 0;
      code.split('\n').forEach(line => {
        const lineStart = offset; offset += line.length + 1;
        if (EDGE_SKIP.test(line)) return;
        const masked = line.replace(/"[^"]*"/g, s => '\u0001'.repeat(s.length));
        idRe.lastIndex = 0;
        let hit;
        while ((hit = idRe.exec(masked))) {
          const openAt = hit.index + hit[0].length;
          const idAt = openAt - nodeId.length;
          for (const [shape, open, close] of SHAPE_DETECT) {
            if (!line.startsWith(open, openAt)) continue;
            const bodyAt = openAt + open.length;
            let label, endAt;
            if (line[bodyAt] === '"') {
              const q = line.indexOf('"', bodyAt + 1);
              if (q < 0 || !line.startsWith(close, q + 1)) continue;
              label = line.slice(bodyAt + 1, q); endAt = q + 1 + close.length;
            } else {
              const c = line.indexOf(close, bodyAt);
              if (c < 0) continue;
              label = line.slice(bodyAt, c); endAt = c + close.length;
            }
            defs.push({ start: lineStart + idAt, end: lineStart + endAt, shape, open, close, label: label.replace(/#quot;/g, '"') });
            idRe.lastIndex = endAt;
            break;
          }
        }
      });
      return defs;
    }

    // One pass over the first definition: { shape, icon, title } or null when the node has no brackets yet.
    function parseNodeDefinition(code, nodeId) {
      const def = findNodeDefs(code, nodeId)[0];
      if (!def) return null;
      const { icon, text } = splitIconLabel(def.label);
      return { shape: def.shape, icon, title: text, def };
    }
    function getNodeLabel(nodeId) {
      const def = findNodeDefs(mermaidCodeInput.value, nodeId)[0];
      return def ? def.label : null;
    }

    // Position right after the first bare (shape-less) mention of nodeId, used to attach a definition.
    function findBareNodeEnd(code, nodeId) {
      const re = new RegExp('(^|[^\\w])' + escapeRegExp(nodeId) + '(?![\\w])');
      let offset = 0, found = -1;
      code.split('\n').some(line => {
        const lineStart = offset; offset += line.length + 1;
        if (EDGE_SKIP.test(line)) return false;
        const hit = re.exec(maskMermaidLine(line));
        if (!hit) return false;
        found = lineStart + hit.index + hit[0].length;
        return true;
      });
      return found;
    }

    function syncNodeToMermaid(nodeId, m) {
      let code = mermaidCodeInput.value;
      const kind = diagramKind(code);
      const isFlowchart = kind === 'flow';
      if (kind === 'sequence') {
        const title = (m.title || '').trim().replace(/\n/g, ' ');
        const decl = new RegExp('^([ \\t]*(?:participant|actor)[ \\t]+' + escapeRegExp(nodeId) + ')(?:[ \\t]+as[ \\t]+.*)?[ \\t]*$', 'm');
        if (title) code = code.replace(decl, (all, head) => title === nodeId ? head : `${head} as ${title}`);
      }
      if (isFlowchart && !findNodeDefs(code, nodeId).length && findSubgraph(code, nodeId)) {
        const title = (m.title || '').trim().replace(/"/g, '#quot;');
        if (title) code = code.replace(subgraphRegex(nodeId), (all, head) => `${head}${nodeId} ["${title}"]`);
      } else if (isFlowchart) {
        const defs = findNodeDefs(code, nodeId);
        const shape = m.shape || (defs[0] ? defs[0].shape : 'rect');
        const cleanTitleText = (m.title || '').trim() || (defs[0] ? splitIconLabel(defs[0].label).text : '') || nodeId;
        const safeTitle = cleanTitleText.replace(/"/g, '#quot;');
        const fullTitle = m.icon && ICONS[m.icon] ? `<span class='relative inline-block px-1'><span class='absolute -top-3 left-1/2 -translate-x-1/2 text-xs leading-none z-10' data-icon='${m.icon}'>${ICONS[m.icon]}</span>${safeTitle}</span>` : safeTitle;
        const parts = [];
        const owner = (m.owner || '').trim().replace(/"/g, '#quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        if (owner) parts.push(`👤 ${owner}`);
        if (m.ct > 0) parts.push(`⏱️ ${m.ct}m`);
        if (m.co > 0) parts.push(`🔄 ${m.co}m`);
        if (m.wip > 0) parts.push(`📦 ${m.wip}pcs`);
        const metricsPill = parts.length ? `<br/><span class='block text-[10px] opacity-80 font-mono leading-tight mt-1'>${parts.join(' | ')}</span>` : '';
        const fullLabel = fullTitle + metricsPill;
        // Atomic definition: ID + brackets + label are replaced together in one pass.
        const define = (tokens) => `${nodeId}${tokens.open}"${fullLabel}"${tokens.close}`;
        if (defs.length) {
          for (let i = defs.length - 1; i >= 0; i--) {
            const d = defs[i];
            const tokens = SHAPE_MAP[shape] || { open: d.open, close: d.close };
            code = code.slice(0, d.start) + define(tokens) + code.slice(d.end);
          }
        } else if (SHAPE_MAP[shape] && (shape !== 'rect' || m.icon || metricsPill || cleanTitleText !== nodeId)) {
          const at = findBareNodeEnd(code, nodeId);
          if (at >= 0) code = code.slice(0, at - nodeId.length) + define(SHAPE_MAP[shape]) + code.slice(at);
        }
      }
      if ((isFlowchart || kind === 'state') && !/^root_(start|end)$/.test(nodeId)) {
        const FR_LINE = /^([ \t]*class[ \t]+)([^\s;]+)([ \t]+friction)[ \t]*;?[ \t]*$/;
        const lines = code.split('\n');
        const hasClass = lines.some(l => { const c = l.match(FR_LINE); return c && c[2].split(',').includes(nodeId); });
        if (m.friction && !hasClass) {
          code = code.replace(/\s*$/, '\n') + `    class ${nodeId} friction${kind === 'state' ? '' : ';'}\n`;
        } else if (!m.friction && hasClass) {
          code = lines.flatMap(l => {
            const c = l.match(FR_LINE);
            if (!c || !c[2].split(',').includes(nodeId)) return [l];
            const rest = c[2].split(',').filter(i => i !== nodeId);
            return rest.length ? [`${c[1]}${rest.join(',')}${c[3]}${kind === 'state' ? '' : ';'}`] : [];
          }).join('\n');
        }
        const anyClass = code.split('\n').some(l => FR_LINE.test(l));
        const hasDef = /^[ \t]*classDef[ \t]+friction\b/m.test(code);
        if (anyClass && !hasDef) code = code.replace(/\s*$/, '\n') + '    classDef friction fill:#451a03,stroke:#f97316,stroke-width:2px,color:#ffedd5;\n';
        else if (!anyClass && hasDef) code = code.replace(/^[ \t]*classDef[ \t]+friction\b.*$\n?/gm, '');
      }
      if (code !== mermaidCodeInput.value) {
        mermaidCodeInput.value = projectState.mermaid = code;
        updateLineNumbers();
        debouncedRender();
      }
    }

    const EDGE_SKIP = /^\s*(?:(?:classDef|class|style|linkStyle|subgraph|click|direction|end)\b|%%)/;
    const EDGE_CONN = /(<)?(?:(?:--|==|-\.)[ \t]+[^\n]*?[ \t]+(?:-{2,}|={2,}|\.-)[>ox]?|(?:-{2,}|={2,}|-\.+-?|~{3,})[>ox]?(?:[ \t]*\|[^|\n]*\|)?)/g;

    function maskMermaidLine(line) {
      let out = line.replace(/"[^"]*"/g, s => '\u0001'.repeat(s.length));
      let prev;
      do { prev = out; out = out.replace(/[\[({][^\[\](){}]*[\])}]/g, s => '\u0001'.repeat(s.length)); } while (out !== prev);
      return out;
    }
    function cleanEdgeLabel(s) { return (s || '').trim().replace(/^"([\s\S]*)"$/, '$1').replace(/#quot;/g, '"').trim(); }
    function headToArrow(h) { return h === '>' ? 'directed' : h === 'o' ? 'circle' : h === 'x' ? 'cross' : 'open'; }

    function parseMermaidConnector(text) {
      let m = text.match(/^(<)?(--|==|-\.)[ \t]+([\s\S]*?)[ \t]+(?:-{2,}|={2,}|\.-)([>ox])?$/);
      if (m) {
        return { label: cleanEdgeLabel(m[3]), style: m[2] === '==' ? 'thick' : m[2] === '-.' ? 'dotted' : 'solid', arrow: m[1] ? 'bidirectional' : headToArrow(m[4]) };
      }
      m = text.match(/^(<)?(-{2,}|={2,}|-\.+-?|~{3,})([>ox])?(?:[ \t]*\|([^|]*)\|)?$/);
      if (!m) return null;
      const body = m[2];
      return { label: cleanEdgeLabel(m[4]), style: body[0] === '~' ? 'invisible' : body[0] === '=' ? 'thick' : body.includes('.') ? 'dotted' : 'solid', arrow: m[1] ? 'bidirectional' : headToArrow(m[3]) };
    }

    function buildMermaidConnector(style, arrow, label) {
      if (style === 'invisible') return '~~~';
      const S = {
        solid: { lead: '--', tail: '', open: '-', end: '--' },
        thick: { lead: '==', tail: '', open: '=', end: '==' },
        dotted: { lead: '-.', tail: '-', open: '', end: '.-' }
      }[style] || { lead: '--', tail: '', open: '-', end: '--' };
      const head = { directed: '>', bidirectional: '>', circle: 'o', cross: 'x' }[arrow] || '';
      const pre = arrow === 'bidirectional' ? '<' : '';
      const safe = (label || '').trim().replace(/"/g, '#quot;');
      if (!safe) return pre + S.lead + S.tail + (head || S.open);
      return `${pre}${S.lead} "${safe}" ${S.end}${head || S.open}`;
    }

    function parseMermaidEdges(code) {
      const edges = [];
      if (!/^\s*(graph|flowchart)\b/m.test(code)) return edges;
      const counts = {};
      let offset = 0;
      code.split('\n').forEach(line => {
        const lineStart = offset; offset += line.length + 1;
        if (EDGE_SKIP.test(line)) return;
        const masked = maskMermaidLine(line);
        const conns = [...masked.matchAll(EDGE_CONN)];
        conns.forEach((m, i) => {
          const prevEnd = i ? conns[i - 1].index + conns[i - 1][0].length : 0;
          const nextStart = i + 1 < conns.length ? conns[i + 1].index : masked.length;
          const src = (masked.slice(prevEnd, m.index).split('&').pop().match(/^\s*(\w+)/) || [])[1];
          const tgt = (masked.slice(m.index + m[0].length, nextStart).split('&')[0].match(/^\s*(\w+)/) || [])[1];
          const parsed = parseMermaidConnector(line.slice(m.index, m.index + m[0].length));
          if (!src || !tgt || !parsed) return;
          const pair = src + '\0' + tgt;
          const idx = counts[pair] = (counts[pair] ?? -1) + 1;
          edges.push({ src, tgt, idx, start: lineStart + m.index, end: lineStart + m.index + m[0].length, ...parsed });
        });
      });
      return edges;
    }

    function edgeKey(e) { return `${e.src}_to_${e.tgt}${e.idx ? '_' + (e.idx + 1) : ''}`; }

    function openEdgeInspectorFromElement(el) {
      const kind = diagramKind(mermaidCodeInput.value);
      if (kind === 'state') return openStateTransitionFromElement(el);
      if (kind !== 'flow') return false;
      if (!el.matches('path')) el = el.closest('g.edgeLabel') || el;
      const edges = parseMermaidEdges(mermaidCodeInput.value);
      if (!edges.length) return false;
      const hitPath = el.matches('path') ? el : el.querySelector('path');
      const pathEl = hitPath?.dataset?.edgeFor ? mermaidRender.querySelector(`[id="${hitPath.dataset.edgeFor}"]`) : hitPath;
      const rawId = pathEl?.id || el.querySelector('[data-id]')?.getAttribute('data-id') || el.getAttribute('data-id') || '';
      const idxMatch = rawId.match(/[-_](\d+)$/);
      const cls = pathEl?.getAttribute('class') || '';
      const ls = cls.match(/\bLS-(\S+)/), le = cls.match(/\bLE-(\S+)/);
      let edge = rawId && edges.find(e => [`L-${e.src}-${e.tgt}-${e.idx}`, `L_${e.src}_${e.tgt}_${e.idx}`].includes(rawId));
      if (!edge && ls && le) edge = edges.find(e => e.src === ls[1] && e.tgt === le[1] && e.idx === (idxMatch ? Number(idxMatch[1]) : 0));
      if (!edge && el.classList.contains('edgeLabel')) {
        edge = edges[[...el.parentElement.children].filter(c => c.classList.contains('edgeLabel')).indexOf(el)];
      }
      if (!edge) {
        const text = el.textContent.trim();
        if (text) edge = edges.find(e => e.label === text);
      }
      if (!edge) return false;
      return showEdgeInspector(edge);
    }

    function refreshEdgeInspectorState(note) {
      const kind = activeEdge?.kind;
      const invisible = document.getElementById('inspectorEdgeStyle').value === 'invisible';
      document.getElementById('inspectorEdgeLabel').disabled = invisible;
      document.getElementById('inspectorEdgeArrow').disabled = invisible || kind === 'state';
      document.getElementById('inspectorEdgeStyle').disabled = kind === 'state';
      const kindNote = { sequence: 'Sequence messages support solid/dotted lines with arrow, open, cross or async heads.', state: 'State transitions support label editing only.' }[kind];
      const noteEl = document.getElementById('inspectorEdgeNote');
      const msg = note || (invisible ? 'Invisible spacers (~~~) do not support labels or arrowheads.' : kindNote || '');
      noteEl.textContent = msg; noteEl.classList.toggle('hidden', !msg);
    }

    function updateActiveEdgeFromInspector() {
      if (!activeEdge) return;
      refreshEdgeInspectorState();
      const code = mermaidCodeInput.value;
      const label = document.getElementById('inspectorEdgeLabel').value;
      const style = document.getElementById('inspectorEdgeStyle').value;
      const arrow = document.getElementById('inspectorEdgeArrow').value;
      if (activeEdge.kind === 'sequence' || activeEdge.kind === 'state') {
        const isSeq = activeEdge.kind === 'sequence';
        const edge = (isSeq ? parseSequenceMessages(code) : parseStateTransitions(code)).find(e => e.ord === activeEdge.ord);
        if (!edge) { refreshEdgeInspectorState('This connection was not found in the Mermaid code.'); return; }
        const text = label.trim().replace(/\n/g, ' ');
        // Mermaid rejects a sequence message with no text, so an empty label becomes a blank entity.
        const repl = isSeq ? `${buildSequenceOperator(style, arrow)}${edge.act || ' '}${edge.tgt}: ${text || '#nbsp;'}` : (text ? ` : ${text}` : '');
        const next = code.slice(0, edge.start) + repl + code.slice(edge.end);
        if (next !== code) { mermaidCodeInput.value = projectState.mermaid = next; updateLineNumbers(); debouncedRender(); }
        return;
      }
      const edge = parseMermaidEdges(code).find(e => e.src === activeEdge.src && e.tgt === activeEdge.tgt && e.idx === activeEdge.idx);
      if (!edge) { refreshEdgeInspectorState('This connection was not found in the Mermaid code.'); return; }
      const next = code.slice(0, edge.start) + buildMermaidConnector(style, arrow, label) + code.slice(edge.end);
      projectState.edges = projectState.edges || {};
      projectState.edges[edgeKey(edge)] = { source: edge.src, target: edge.tgt, label: label.trim(), style, arrow };
      if (next !== code) {
        mermaidCodeInput.value = projectState.mermaid = next;
        updateLineNumbers();
        debouncedRender();
      }
    }

    function handleFileDrop(e) { e.preventDefault(); document.getElementById('dropZone').classList.remove('bg-blue-950/20'); if (e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]); }
    function handleFileSelect(e) { if (e.target.files.length > 0) loadFile(e.target.files[0]); }
    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const content = evt.target.result;
        if (file.name.endsWith('.json')) {
          try {
            const parsed = JSON.parse(content);
            if (parsed.mermaid) {
              projectState = parsed;
              projectState.metrics = projectState.metrics || {};
              normalizePositions();
              if (parsed.project?.title) projectState.title = parsed.project.title;
              mermaidCodeInput.value = parsed.mermaid;
            }
          } catch(err) { alert('Invalid project JSON file.'); }
        } else { projectState.mermaid = content; mermaidCodeInput.value = content; }
        updateLineNumbers(); renderDiagram(); calculateVSMMetrics();
      };
      reader.readAsText(file);
    }

    function saveProjectJSON() {
      projectState.mermaid = mermaidCodeInput.value;
      const jsonStr = JSON.stringify(projectState, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      const title = projectState.project?.title || projectState.title || "vsm_project";
      a.download = `${title.toLowerCase().replace(/\s+/g, '_')}.vsm.json`; a.click();
    }

    function updateLineNumbers() { lineNumbers.innerHTML = Array.from({ length: mermaidCodeInput.value.split('\n').length }, (_, i) => i + 1).join('<br>'); }
    function showError(msg) { errorMessage.textContent = msg; errorBanner.classList.remove('hidden'); }
    function dismissError() { errorBanner.classList.add('hidden'); }
    function updateStatus(text, color) {
      const colorMap = { emerald: 'bg-emerald-500', rose: 'bg-rose-500', amber: 'bg-amber-500' };
      statusIndicator.innerHTML = `<span class="w-2 h-2 rounded-full ${colorMap[color] || 'bg-slate-500'}"></span><span class="text-slate-300">${text}</span>`;
    }

    function refitCanvas() {
      if (!panZoomInstance) return;
      panZoomInstance.resize(); panZoomInstance.fit(); panZoomInstance.center();
    }
    function toggleEditorPanel() {
      const body = document.getElementById('editorBody');
      const collapsed = body.classList.toggle('hidden');
      const btn = document.getElementById('editorToggleBtn');
      btn.innerHTML = `<i data-lucide="${collapsed ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4"></i>`;
      lucide.createIcons();
      if (panZoomInstance) panZoomInstance.resize();
    }
    // Below 768px the editor starts collapsed (header bar only) so the canvas is full-bleed
    const mobileMQ = window.matchMedia('(max-width: 767px)');
    function setEditorCollapsed(collapsed) {
      const body = document.getElementById('editorBody');
      if (body.classList.contains('hidden') === collapsed) return;
      toggleEditorPanel();
    }
    function applyMobileCollapse() {
      setEditorCollapsed(mobileMQ.matches);
      document.getElementById('objectLibrary').classList.toggle('w-44', !mobileMQ.matches);
    }
    mobileMQ.addEventListener('change', () => { applyMobileCollapse(); setTimeout(refitCanvas, 50); });
    let resizeTimer;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(refitCanvas, 100); });

    function zoomIn() { if (panZoomInstance) panZoomInstance.zoomIn(); }
    function zoomOut() { if (panZoomInstance) panZoomInstance.zoomOut(); }
    function resetZoom() { if (panZoomInstance) { panZoomInstance.resetZoom(); panZoomInstance.fit(); panZoomInstance.center(); } }
    function clearCode() { mermaidCodeInput.value = ''; updateLineNumbers(); renderDiagram(); calculateVSMMetrics(); }
    function formatCode() { mermaidCodeInput.value = mermaidCodeInput.value.split('\n').map(l => l.trimEnd()).join('\n'); updateLineNumbers(); }
    const EXPORT_STYLE_PROPS = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray', 'opacity', 'font-family', 'font-size', 'font-weight', 'font-style', 'color', 'background-color', 'text-anchor', 'dominant-baseline', 'text-align', 'line-height', 'display', 'padding', 'white-space', 'overflow', 'visibility', 'filter'];
    function exportBaseName() {
      const t = (projectState.title || 'mermaid-studio').toString().trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      return `${t || 'mermaid-studio'}.vsm`;
    }
    // Clone the live SVG with computed styles inlined, pan/zoom reset and namespaces set so it renders standalone.
    function buildStandaloneSVG() {
      const svg = mermaidRender.querySelector('svg');
      if (!svg) return null;
      const clone = svg.cloneNode(true);
      const srcNodes = [svg, ...svg.querySelectorAll('*')];
      const dstNodes = [clone, ...clone.querySelectorAll('*')];
      srcNodes.forEach((src, i) => {
        const cs = getComputedStyle(src);
        const dst = dstNodes[i];
        let css = dst.getAttribute('style') || '';
        EXPORT_STYLE_PROPS.forEach(p => { const v = cs.getPropertyValue(p); if (v) css += `;${p}:${v}`; });
        dst.setAttribute('style', css);
      });
      clone.querySelectorAll('.edge-hit, .anchor-socket, [id^="gooey"]').forEach(el => el.remove());
      const vp = clone.querySelector('g.svg-pan-zoom_viewport');
      if (vp) vp.removeAttribute('transform'), vp.removeAttribute('style');
      clone.querySelectorAll('.svg-pan-zoom-control').forEach(el => el.remove());
      const live = svg.querySelector('g.svg-pan-zoom_viewport') || svg;
      const b = live.getBBox();
      const pad = 24;
      const w = Math.ceil(b.width + pad * 2), h = Math.ceil(b.height + pad * 2);
      clone.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${w} ${h}`);
      clone.setAttribute('width', w); clone.setAttribute('height', h);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
      clone.querySelectorAll('foreignObject > *').forEach(el => { if (!el.getAttribute('xmlns')) el.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml'); });
      clone.style.backgroundColor = '#0b0f19';
      return { xml: new XMLSerializer().serializeToString(clone), w, h };
    }
    function downloadURL(url, name) {
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    }
    function exportSVG() {
      try {
        const out = buildStandaloneSVG();
        if (!out) { updateStatus('Nothing to export: render a diagram first', 'amber'); return; }
        const url = URL.createObjectURL(new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + out.xml], { type: 'image/svg+xml;charset=utf-8' }));
        downloadURL(url, `${exportBaseName()}.svg`);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        updateStatus('Exported SVG successfully', 'emerald');
      } catch (err) { console.error(err); updateStatus('SVG export failed', 'rose'); }
    }
    function exportPNG() {
      let out;
      try { out = buildStandaloneSVG(); } catch (err) { console.error(err); updateStatus('PNG export failed', 'rose'); return; }
      if (!out) { updateStatus('Nothing to export: render a diagram first', 'amber'); return; }
      const img = new Image();
      img.onload = () => {
        try {
          const scale = 2;
          const canvas = document.createElement('canvas');
          canvas.width = out.w * scale; canvas.height = out.h * scale;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0b0f19'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          downloadURL(canvas.toDataURL('image/png'), `${exportBaseName()}.png`);
          updateStatus('Exported PNG successfully', 'emerald');
        } catch (err) { console.error(err); updateStatus('PNG export failed (canvas blocked)', 'rose'); }
      };
      img.onerror = () => updateStatus('PNG export failed', 'rose');
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out.xml);
    }
  </script>
</body>
</html>
