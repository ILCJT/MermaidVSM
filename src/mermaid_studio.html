<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mermaid Studio - Process & VSM Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .code-input { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; tab-size: 2; }
    .bg-grid-pattern { background-size: 24px 24px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
  </style>
</head>
<body class="h-full flex flex-col text-slate-100 overflow-hidden font-sans">
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex flex-wrap items-center justify-between gap-2 z-20 shrink-0">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 p-1.5 rounded-lg flex items-center justify-center text-white"><i data-lucide="code-2" class="w-5 h-5"></i></div>
      <div>
        <h1 class="text-sm font-bold leading-none text-slate-100">Mermaid Studio</h1>
        <p class="text-[10px] text-slate-400 font-medium">Process & VSM Workspace</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <select id="templateSelect" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-md px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500 max-w-[180px] sm:max-w-[240px] truncate">
        <option value="rma">RMA Process & Ownership</option>
        <option value="swimlanes">Department Swimlanes</option>
        <option value="vsm">Value Stream Process Flow</option>
      </select>
    </div>
    <div class="flex items-center space-x-1.5">
      <div class="flex bg-slate-800 p-0.5 rounded-md lg:hidden border border-slate-700">
        <button id="tabCode" onclick="switchTab('code')" class="px-2.5 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-100 transition">Code</button>
        <button id="tabPreview" onclick="switchTab('preview')" class="px-2.5 py-1 text-xs font-semibold rounded bg-blue-600 text-white shadow">Preview</button>
      </div>
      <label class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-slate-200 text-xs font-medium flex items-center space-x-1 cursor-pointer transition">
        <i data-lucide="folder-open" class="w-3.5 h-3.5 text-amber-400"></i>
        <span class="hidden sm:inline">Open</span>
        <input type="file" id="fileInput" accept=".vsm.json,.json,.mmd" class="hidden" onchange="handleFileSelect(event)">
      </label>
      <button onclick="saveProjectJSON()" title="Save Project (.vsm.json)" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-slate-200 text-xs font-medium flex items-center space-x-1 transition">
        <i data-lucide="save" class="w-3.5 h-3.5 text-emerald-400"></i>
        <span class="hidden sm:inline">Project</span>
      </button>
      <button onclick="exportSVG()" title="Export SVG" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-slate-200 text-xs font-medium flex items-center space-x-1 transition">
        <i data-lucide="file-code-2" class="w-3.5 h-3.5 text-blue-400"></i>
        <span class="hidden sm:inline">SVG</span>
      </button>
      <button onclick="exportPNG()" title="Export PNG" class="px-2 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-md text-white text-xs font-medium flex items-center space-x-1 shadow transition">
        <i data-lucide="image" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">PNG</span>
      </button>
    </div>
  </header>
  <main id="dropZone" class="flex-1 flex relative overflow-hidden">
    <section id="editorPanel" class="w-full lg:w-5/12 h-full bg-slate-900 flex flex-col border-r border-slate-800 z-10 hidden lg:flex">
      <div class="px-3 py-1.5 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400 shrink-0">
        <span class="font-mono text-[11px] text-slate-400 flex items-center gap-1.5"><i data-lucide="file-text" class="w-3.5 h-3.5 text-slate-500"></i> diagram.mmd</span>
        <div class="flex items-center space-x-2">
          <button onclick="renderDiagram()" class="px-2 py-0.5 bg-blue-600 hover:bg-blue-500 text-white rounded font-semibold text-[11px] flex items-center gap-1 shadow transition"><i data-lucide="play" class="w-3 h-3 fill-current"></i> Render</button>
          <button onclick="formatCode()" class="hover:text-slate-200 transition flex items-center gap-1 ml-1"><i data-lucide="align-left" class="w-3 h-3"></i> Format</button>
          <button onclick="clearCode()" class="hover:text-rose-400 transition flex items-center gap-1"><i data-lucide="trash-2" class="w-3 h-3"></i> Clear</button>
        </div>
      </div>
      <div class="flex-1 relative overflow-hidden flex">
        <div id="lineNumbers" class="w-10 bg-slate-950/60 text-slate-600 text-right pr-2 pt-3 font-mono text-xs select-none border-r border-slate-800/50 shrink-0">1</div>
        <textarea id="mermaidCode" spellcheck="false" class="code-input flex-1 h-full w-full bg-transparent text-slate-200 p-3 text-xs leading-relaxed focus:outline-none resize-none overflow-auto" placeholder="Type or paste Mermaid syntax here..."></textarea>
      </div>
    </section>
    <section id="previewPanel" class="w-full lg:w-7/12 h-full bg-slate-950 bg-grid-pattern relative flex flex-col flex-1 overflow-hidden">
      <div id="errorBanner" class="hidden absolute top-3 left-3 right-3 bg-rose-950/90 border border-rose-600/80 text-rose-200 p-3 rounded-lg shadow-xl z-30 max-h-40 overflow-auto backdrop-blur-sm transition-all">
        <div class="flex items-start justify-between">
          <div class="flex items-start space-x-2">
            <i data-lucide="alert-triangle" class="w-5 h-5 text-rose-400 shrink-0 mt-0.5"></i>
            <div>
              <h4 class="text-xs font-bold text-rose-300">Mermaid Syntax Error</h4>
              <p id="errorMessage" class="text-xs font-mono mt-1 text-rose-200/90 whitespace-pre-wrap leading-tight"></p>
            </div>
          </div>
          <button onclick="dismissError()" class="text-rose-400 hover:text-rose-200 p-0.5"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
      </div>
      <div class="absolute top-3 right-3 flex items-center bg-slate-900/90 border border-slate-800 rounded-lg p-1 space-x-1 z-20 backdrop-blur-sm shadow-md">
        <button onclick="zoomIn()" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition" title="Zoom In"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
        <button onclick="zoomOut()" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition" title="Zoom Out"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
        <button onclick="resetZoom()" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition" title="Reset View"><i data-lucide="maximize-2" class="w-4 h-4"></i></button>
      </div>
      <div id="canvasContainer" class="w-full h-full flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing">
        <div id="mermaidRender" class="w-full h-full flex items-center justify-center"></div>
      </div>
      <aside id="inspectorDrawer" class="hidden absolute top-0 right-0 bottom-0 w-80 bg-slate-900/95 border-l border-slate-800 shadow-2xl z-30 flex flex-col backdrop-blur-md transition-all">
        <div class="p-3 border-b border-slate-800 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <i data-lucide="sliders" class="w-4 h-4 text-blue-400"></i>
            <h3 class="text-xs font-bold text-slate-100">Node Inspector</h3>
          </div>
          <button onclick="closeInspector()" class="text-slate-400 hover:text-slate-200 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 space-y-4 overflow-y-auto flex-1 text-xs">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Node ID</label>
            <input type="text" id="inspectorNodeId" readonly class="w-full bg-slate-950 border border-slate-800 text-slate-400 rounded px-2.5 py-1.5 font-mono">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Step Name / Title</label>
            <input type="text" id="inspectorTitle" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Owner / Department</label>
            <input type="text" id="inspectorOwner" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500" placeholder="e.g. Quality Assurance">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Cycle Time (min)</label>
              <input type="number" id="inspectorCT" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500" min="0">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Changeover (min)</label>
              <input type="number" id="inspectorCO" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500" min="0">
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">WIP Quantity (pcs)</label>
            <input type="number" id="inspectorWIP" oninput="updateActiveNodeFromInspector()" class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded px-2.5 py-1.5 focus:ring-1 focus:ring-blue-500" min="0">
          </div>
          <div class="pt-2 border-t border-slate-800">
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" id="inspectorFriction" onchange="updateActiveNodeFromInspector()" class="rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-blue-500">
              <span class="text-xs font-semibold text-rose-300">Flag as Friction / Bottleneck Point</span>
            </label>
          </div>
        </div>
      </aside>
    </section>
  </main>
  <footer class="bg-slate-900 border-t border-slate-800 px-3 py-1 flex items-center justify-between text-[11px] text-slate-400 shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <span id="statusIndicator" class="flex items-center space-x-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span class="text-slate-300">Ready</span></span>
      <span class="text-slate-600">|</span>
      <span id="nodeCount">Nodes: 0</span>
    </div>
    <div><span class="text-slate-500">Engine: Mermaid v10</span></div>
  </footer>
  <script>
    const TEMPLATES = {
      rma: `graph TD\n    A["1. Customer Request"] --> B["2. Technical Review"]\n    B --> C{"3. Defect Valid?"}\n    C -- Yes --> D["4. Issue RMA #"]\n    C -- No --> E["5. Reject Claim"]\n    D --> F["6. Quarantine & Test"]\n\n    subgraph CS["Customer Support"]\n        A\n        E\n    end\n    subgraph QA["Quality Assurance"]\n        B\n        C\n        F\n    end\n    subgraph LOG["Logistics / Ops"]\n        D\n    end`,
      swimlanes: `sequenceDiagram\n    actor C as Customer\n    participant CS as Customer Support\n    participant QA as QA Engineering\n    C->>CS: Submit Return Request\n    CS->>QA: Forward Details`,
      vsm: `graph LR\n    P1["Receiving / Quarantine"] --> I1[/"WIP: 50 Pcs"\\\\] --> P2["Testing & Inspection"]`
    };
    let projectState = { title: "RMA Process Current State", mermaid: TEMPLATES.rma, metrics: {} };
    let panZoomInstance = null, renderTimeout = null, activeNodeId = null;
    const mermaidCodeInput = document.getElementById('mermaidCode');
    const mermaidRender = document.getElementById('mermaidRender');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    const statusIndicator = document.getElementById('statusIndicator');
    const lineNumbers = document.getElementById('lineNumbers');
    const inspectorDrawer = document.getElementById('inspectorDrawer');

    window.addEventListener('DOMContentLoaded', () => {
      mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose', flowchart: { htmlLabels: true, curve: 'basis' } });
      mermaidCodeInput.value = projectState.mermaid;
      updateLineNumbers(); renderDiagram();
      ['input', 'paste', 'change', 'keyup'].forEach(evt => {
        mermaidCodeInput.addEventListener(evt, () => { projectState.mermaid = mermaidCodeInput.value; updateLineNumbers(); debouncedRender(); });
      });
      const dropZone = document.getElementById('dropZone');
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-950/20'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-blue-950/20'));
      dropZone.addEventListener('drop', handleFileDrop);
      mermaidRender.addEventListener('click', (e) => {
        const nodeEl = e.target.closest('.node');
        if (nodeEl) {
          const rawId = nodeEl.id || '';
          openInspector(rawId.replace(/^flowchart-/, '').replace(/-\d+$/, ''));
        }
      });
      document.getElementById('templateSelect').addEventListener('change', (e) => {
        if (TEMPLATES[e.target.value]) {
          mermaidCodeInput.value = TEMPLATES[e.target.value];
          projectState.mermaid = TEMPLATES[e.target.value];
          updateLineNumbers(); renderDiagram();
        }
      });
      lucide.createIcons();
    });

    function debouncedRender() { clearTimeout(renderTimeout); renderTimeout = setTimeout(renderDiagram, 200); }
    async function renderDiagram() {
      const code = mermaidCodeInput.value.trim();
      if (!code) { mermaidRender.innerHTML = '<p class="text-xs text-slate-500 font-mono">No diagram definition provided.</p>'; updateStatus('Ready', 'emerald'); dismissError(); return; }
      let pan = null, zoom = null;
      if (panZoomInstance) { pan = panZoomInstance.getPan(); zoom = panZoomInstance.getZoom(); }
      try {
        await mermaid.parse(code);
        mermaidRender.innerHTML = '';
        const id = 'mermaid-svg-' + Date.now();
        const { svg } = await mermaid.render(id, code);
        mermaidRender.innerHTML = svg;
        dismissError(); updateStatus('Rendered', 'emerald');
        const svgElement = mermaidRender.querySelector('svg');
        if (svgElement) {
          svgElement.style.width = '100%'; svgElement.style.height = '100%';
          if (panZoomInstance) panZoomInstance.destroy();
          panZoomInstance = svgPanZoom(svgElement, { zoomEnabled: true, controlIconsEnabled: false, fit: true, center: true, minZoom: 0.2, maxZoom: 8 });
          if (pan && zoom) { panZoomInstance.zoom(zoom); panZoomInstance.pan(pan); }
        }
        const nodes = (code.match(/\[.*?\]|\(.*?\)|/g) || []).length;
        document.getElementById('nodeCount').textContent = `Nodes: ~${Math.floor(nodes / 2)}`;
      } catch (err) { showError(err.str || err.message || 'Syntax Error encountered.'); updateStatus('Syntax Error', 'rose'); }
    }

    function openInspector(nodeId) {
      activeNodeId = nodeId; document.getElementById('inspectorNodeId').value = nodeId;
      if (!projectState.metrics[nodeId]) { projectState.metrics[nodeId] = { title: nodeId, owner: '', ct: 0, co: 0, wip: 0, friction: false }; }
      const m = projectState.metrics[nodeId];
      document.getElementById('inspectorTitle').value = m.title || nodeId;
      document.getElementById('inspectorOwner').value = m.owner || '';
      document.getElementById('inspectorCT').value = m.ct || 0;
      document.getElementById('inspectorCO').value = m.co || 0;
      document.getElementById('inspectorWIP').value = m.wip || 0;
      document.getElementById('inspectorFriction').checked = !!m.friction;
      inspectorDrawer.classList.remove('hidden');
    }

    function closeInspector() { inspectorDrawer.classList.add('hidden'); activeNodeId = null; }
    function updateActiveNodeFromInspector() {
      if (!activeNodeId) return;
      projectState.metrics[activeNodeId] = {
        title: document.getElementById('inspectorTitle').value,
        owner: document.getElementById('inspectorOwner').value,
        ct: parseFloat(document.getElementById('inspectorCT').value) || 0,
        co: parseFloat(document.getElementById('inspectorCO').value) || 0,
        wip: parseFloat(document.getElementById('inspectorWIP').value) || 0,
        friction: document.getElementById('inspectorFriction').checked
      };
    }

    function handleFileDrop(e) { e.preventDefault(); document.getElementById('dropZone').classList.remove('bg-blue-950/20'); if (e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]); }
    function handleFileSelect(e) { if (e.target.files.length > 0) loadFile(e.target.files[0]); }
    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const content = evt.target.result;
        if (file.name.endsWith('.json')) {
          try {
            const parsed = JSON.parse(content);
            if (parsed.mermaid) { projectState = parsed; mermaidCodeInput.value = parsed.mermaid; }
          } catch(err) { alert('Invalid project JSON file.'); }
        } else { projectState.mermaid = content; mermaidCodeInput.value = content; }
        updateLineNumbers(); renderDiagram();
      };
      reader.readAsText(file);
    }

    function saveProjectJSON() {
      projectState.mermaid = mermaidCodeInput.value;
      const jsonStr = JSON.stringify(projectState, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `${projectState.title.toLowerCase().replace(/\s+/g, '_')}.vsm.json`; a.click();
    }

    function updateLineNumbers() { lineNumbers.innerHTML = Array.from({ length: mermaidCodeInput.value.split('\n').length }, (_, i) => i + 1).join('<br>'); }
    function showError(msg) { errorMessage.textContent = msg; errorBanner.classList.remove('hidden'); }
    function dismissError() { errorBanner.classList.add('hidden'); }
    function updateStatus(text, color) {
      const colorMap = { emerald: 'bg-emerald-500', rose: 'bg-rose-500', amber: 'bg-amber-500' };
      statusIndicator.innerHTML = `<span class="w-2 h-2 rounded-full ${colorMap[color] || 'bg-slate-500'}"></span><span class="text-slate-300">${text}</span>`;
    }

    function switchTab(tab) {
      const editorPanel = document.getElementById('editorPanel');
      const previewPanel = document.getElementById('previewPanel');
      if (tab === 'code') { editorPanel.classList.remove('hidden'); previewPanel.classList.add('hidden'); }
      else { editorPanel.classList.add('hidden'); previewPanel.classList.remove('hidden'); if (panZoomInstance) { panZoomInstance.resize(); panZoomInstance.fit(); panZoomInstance.center(); } }
    }

    function zoomIn() { if (panZoomInstance) panZoomInstance.zoomIn(); }
    function zoomOut() { if (panZoomInstance) panZoomInstance.zoomOut(); }
    function resetZoom() { if (panZoomInstance) { panZoomInstance.resetZoom(); panZoomInstance.fit(); panZoomInstance.center(); } }
    function clearCode() { mermaidCodeInput.value = ''; updateLineNumbers(); renderDiagram(); }
    function formatCode() { mermaidCodeInput.value = mermaidCodeInput.value.split('\n').map(l => l.trimEnd()).join('\n'); updateLineNumbers(); }
    function exportSVG() {
      const svg = mermaidRender.querySelector('svg');
      if (!svg) return alert('No diagram to export.');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
      a.download = `vsm-process-${Date.now()}.svg`; a.click();
    }
    function exportPNG() {
      const svg = mermaidRender.querySelector('svg');
      if (!svg) return alert('No diagram to export.');
      const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); const img = new Image();
      img.onload = () => {
        canvas.width = img.width * 2; canvas.height = img.height * 2;
        ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = `vsm-process-${Date.now()}.png`; a.click();
      };
      img.src = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
    }
  </script>
</body>
</html>
